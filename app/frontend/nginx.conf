# Included in the http context of nginx-unprivileged. Containers in an ECS task share one network
# namespace, so the Flask API is reachable on 127.0.0.1:5000 and is never exposed outside the task.
log_format json escape=json '{"event":"request","time":"$time_iso8601","method":"$request_method","path":"$uri",'
                            '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time}';

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log /dev/stdout json;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
