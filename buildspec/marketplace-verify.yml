version: 0.2
# Stage: verify publication status; fails closed; writes verification.json.
env:
  shell: bash
phases:
  install:
    on-failure: ABORT
    commands:
      - source ci/install-node.sh
      - npm ci
      - npm run build
  build:
    on-failure: ABORT
    commands:
      - ci/restore-artifact.sh ProcessingOutput
      - ci/marketplace-verify.sh
artifacts:
  files:
    - marketplace/release/**/*
    - reports/**/*
